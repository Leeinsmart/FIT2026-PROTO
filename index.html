<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>臺北資料夾 File in Taipei 2026</title>
<style>
:root{--navy:#1F3A6B;--pink:#F3DCE3;--blue:#DCEAF5;--cream:#FAF8F2;--mag:#A83A6B;--ink:#222;--line:#D9D4C7;--face:#C98FA8;--cover:#7FA6CC;--video:#4A4A4A}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;line-height:1.7}
a{color:var(--navy)}
a:hover{color:var(--mag)}
.en{color:#666;font-size:.92em}

/* 固定 menu */
.menu{position:sticky;top:0;z-index:10;background:#fff;border-bottom:2px solid var(--navy)}
.menu .in{max-width:1100px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:24px}
.logo{font-weight:700;color:var(--navy);text-decoration:none;font-size:17px;margin-right:auto;cursor:pointer;white-space:nowrap}
.nav{display:flex;gap:24px;align-items:center}
.nav a{text-decoration:none;color:var(--navy);font-weight:600;cursor:pointer}
.burger{display:none;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:6px 12px;font-size:14px;cursor:pointer}
@media(max-width:768px){
  .nav{display:none}
  .nav.open{display:flex;flex-direction:column;align-items:flex-start;position:absolute;left:0;right:0;top:56px;background:#fff;border-bottom:2px solid var(--navy);padding:12px 16px 16px;gap:14px}
  .burger{display:block}
}

.wrap{max-width:1100px;margin:0 auto;padding:16px}
section{padding:28px 0;scroll-margin-top:64px}
h2{margin:0 0 16px;color:var(--navy);font-size:22px}
h2 .en,h3 .en{font-weight:400;margin-left:8px}
h3{margin:18px 0 6px;color:var(--navy);font-size:18px}
p{margin:0 0 10px}
.muted{color:#666;font-size:14px}

/* 首頁 ① */
.hero{background:var(--navy);color:#fff;padding:48px 28px;border-radius:12px}
.hero .t1{font-size:34px;font-weight:700;line-height:1.2;margin:0}
.hero .t2{font-size:20px;color:#A9C8E8;margin:4px 0 16px}
.hero p{color:#E6EEF8;max-width:720px}
.hero .en{color:#B8CCE6}

/* 首頁 ②③ */
.sec-artists{background:var(--pink);border-radius:12px;padding:24px}
.sec-works{background:var(--blue);border-radius:12px;padding:24px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.grid.works{grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}
@media(min-width:769px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}.grid.works{grid-template-columns:repeat(5,1fr)}}
/* 索引卡：上緣一個資料夾分頁標籤，卡身白底細框 */
.card{cursor:pointer;color:var(--navy)}
.card .tab{display:inline-block;background:var(--navy);color:#fff;font-size:11px;letter-spacing:.5px;padding:2px 12px 1px;border-radius:6px 6px 0 0;font-family:Menlo,monospace}
.card .body{background:#fff;border:1.5px solid var(--navy);border-radius:0 8px 8px 8px;overflow:hidden;box-shadow:2px 2px 0 rgba(31,58,107,.12)}
.card:hover .tab{background:var(--mag)}
.card:hover .body{border-color:var(--mag);box-shadow:2px 2px 0 rgba(168,58,107,.2)}
.card .cap{padding:8px 10px;font-size:14px;line-height:1.45;border-top:1px dashed #C9CFDA}
.card .cap b{display:block}
.block{display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;text-align:center;padding:8px}
.ph-face{background:var(--face);aspect-ratio:1/1}
.ph-cover{background:var(--cover);aspect-ratio:4/3}
.ph-video{background:var(--video)}

/* 頁尾 ④ */
.footer{background:var(--navy);color:#D6E4F5;border-radius:12px;padding:24px 28px;font-size:14px}
.footer div{margin:2px 0}
.footer .en{color:#A9C8E8}

/* 專頁 */
.head{display:grid;grid-template-columns:200px 1fr;gap:24px;border-radius:12px;padding:24px}
.head.artist{background:var(--pink)}
.head.work{background:var(--blue)}
@media(max-width:600px){.head{grid-template-columns:1fr}}
.face{width:200px;height:200px;border-radius:50%}
.name{font-size:26px;font-weight:700;color:var(--navy);margin:0;line-height:1.3}
.name small{display:block;font-size:16px;font-weight:400;color:#555;margin-top:4px}
.links a{display:inline-block;margin:6px 12px 0 0;padding:6px 12px;border:1px solid var(--navy);border-radius:20px;text-decoration:none;font-size:14px}
.links a:hover{border-color:var(--mag)}
.chips a{display:inline-block;margin:0 10px 6px 0;font-weight:700;cursor:pointer;color:var(--mag);text-decoration:underline}

/* 作品圖瀏覽 */
.gallery .main{aspect-ratio:3/2;border-radius:10px;font-size:18px}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:4px}
.thumbs .block{flex:0 0 96px;height:68px;border-radius:6px;cursor:pointer;border:3px solid transparent;font-size:12px}
.thumbs .block.on{border-color:var(--mag)}
.work-body{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;margin-top:20px}
@media(max-width:768px){.work-body{grid-template-columns:1fr}}
dl{margin:0}
dt{font-weight:700;color:var(--navy);margin-top:12px}
dd{margin:0}
</style>
</head>

  {id:'W10', title:['窗','Window'], artists:['A08'], imgs:3, video:true,
   meta:['手繪逐格動畫、彩色、有聲｜12 分鐘｜展場','Hand-drawn animation, colour, sound | 12 min | gallery'],
   desc:[['九十天，每天一張：雷耶斯住處窗外的那棟公寓、晾衣竿、對面的早餐店。九十張畫接成十二分鐘，看得到季節從冬天走到初夏。'],
         ['Ninety days, one drawing a day: the apartment block outside Reyes\'s window, the laundry poles, the breakfast shop across the street. Ninety drawings make twelve minutes, in which the season moves from winter to early summer.']]},
];

const SITE = {
  t1:'臺北資料夾', t2:'File in Taipei 2026',
  dates:['駐地創作 2026.3.2 – 5.29｜成果展 2026.6.5 – 6.28','Residency 2 Mar – 29 May 2026 | Exhibition 5 – 28 Jun 2026'],
  intro:['「臺北資料夾」是臺北市政府青年局的國內外青年藝術家交流計畫。2026 年春天，8 位來自臺灣、日本、韓國、德國、泰國、法國、奈及利亞與菲律賓的青年藝術家在臺北駐地創作三個月，把這座城市當成一個資料夾，各自放進一件或幾件作品。這個網站收錄 8 位藝術家與 10 件作品。',
         'File in Taipei is an exchange program for young artists from Taiwan and abroad, run by Taipei City Government. In spring 2026, eight artists from Taiwan, Japan, Korea, Germany, Thailand, France, Nigeria and the Philippines spent three months in Taipei, treating the city as a folder and filing one or more works into it. This site presents the eight artists and ten works.'],
  secArtists:['② 藝術家','Artists'], secWorks:['③ 作品','Works'],
  face:'大頭貼', cover:'作品封面', videoShort:'影片',
  bio:['基本介紹','About'], links:['外部連結','Links'], newtab:'新分頁 new tab',
  thisWorks:['本次作品','Works in this program'],
  video:['影片，點了直接播放','Video, plays on click'],
  img:'作品圖', byArtists:['創作藝術家','Artists'], desc:['詳細介紹','About the work'],
  meta:['媒材／尺寸／地點','Medium / Size / Location'], thanks:['感謝名單','Acknowledgements'],
  footer:[
    ['主辦單位：臺北市政府青年局','Organizer: Taipei City Government'],
    ['承辦單位：藝高文創股份有限公司','Implementer: 藝高文創股份有限公司'],
    ['臺北資料夾 File in Taipei 2026',''],
    ['© 2026 臺北市政府青年局','All rights reserved.'],
    ['聯絡信箱：info@fileintaipei.tw','Contact: info@fileintaipei.tw'],
  ],
};
const bi = p => `${p[0]}<span class="en">${p[1]}</span>`;            /* 同一行：中文 英文 */
const biH = (tag, p) => `<${tag}>${p[0]}<span class="en">${p[1]}</span></${tag}>`;
const paras = (arr, cls) => arr.map(s => `<p${cls ? ' class="' + cls + '"' : ''}>${s}</p>`).join('');

/* ===== 路由：#/home、#/artists/A01、#/works/W01 ===== */
const state = {path: ''};
function hashPath(){ return location.hash.replace(/^#/, ''); }
function parse(){
  let h = state.path;
  if(!h) h = '/home';
  const p = h.split('/').filter(Boolean);
  const type = p[0] || 'home';
  const id = p[1] || '';
  return {type, id, path:'/' + [type, id].filter(Boolean).join('/')};
}
function go(path){
  state.path = path;
  try{ location.hash = path; }catch(e){}
  if(hashPath() !== path) render();   /* 網址列不能帶 # 的環境（例如 data: 開啟）就直接換畫面 */
}
let pendingScroll = null;
function menuTo(sec){
  const r = parse();
  closeNav();
  if(r.type === 'home'){ scrollToSec(sec); }
  else { pendingScroll = sec; go('/home'); }
}
function scrollToSec(sec){
  const el = document.getElementById(sec);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}
function closeNav(){ document.getElementById('nav').classList.remove('open'); setBurger(); }
function setBurger(){ document.getElementById('burger').textContent = document.getElementById('nav').classList.contains('open') ? '關閉 Close' : '選單 Menu'; }

/* ===== 畫面 ===== */
function worksOf(aid){ return WORKS.filter(w => w.artists.includes(aid)); }
function artist(id){ return ARTISTS.find(a => a.id === id); }
function workById(id){ return WORKS.find(w => w.id === id); }

function renderMenu(r){
  document.getElementById('logo').onclick = () => { closeNav(); if(r.type === 'home'){ window.scrollTo({top:0, behavior:'smooth'}); } else { go('/home'); } };
  document.getElementById('navArtists').onclick = () => menuTo('artists');
  document.getElementById('navWorks').onclick = () => menuTo('works');
  document.getElementById('burger').onclick = () => { document.getElementById('nav').classList.toggle('open'); setBurger(); };
}

function artistCard(a){
  return `<div class="card" onclick="go('/artists/${a.id}')">
    <div class="tab">${a.id}</div>
    <div class="body">
      <div class="block ph-face">${SITE.face}<br>${a.id}</div>
      <div class="cap"><b>${a.name}</b><span class="muted">${a.nat[0]} ${a.nat[1]}</span></div>
    </div></div>`;
}
function workCard(w){
  const cls = w.video ? 'ph-cover ph-video' : 'ph-cover';
  return `<div class="card" onclick="go('/works/${w.id}')">
    <div class="tab">${w.id}</div>
    <div class="body">
      <div class="block ${cls}">${w.video ? SITE.videoShort : SITE.cover}<br>${w.id}</div>
      <div class="cap"><b>${w.title[0]}</b><span class="en">${w.title[1]}</span></div>
    </div></div>`;
}

function renderHome(){
  return `
  <section id="top">
    <div class="hero">
      <p class="t1">${SITE.t1}</p>
      <p class="t2">${SITE.t2}</p>
      <p>${SITE.dates[0]}<br><span class="en">${SITE.dates[1]}</span></p>
      <p>${SITE.intro[0]}</p><p class="en">${SITE.intro[1]}</p>
    </div>
  </section>
  <section id="artists">
    <div class="sec-artists">
      ${biH('h2', SITE.secArtists)}
      <div class="grid">${ARTISTS.map(artistCard).join('')}</div>
    </div>
  </section>
  <section id="works">
    <div class="sec-works">
      ${biH('h2', SITE.secWorks)}
      <div class="grid works">${WORKS.map(workCard).join('')}</div>
    </div>
  </section>
  <section id="footer">
    <div class="footer">
      ${SITE.footer.map(p => `<div>${p[0]}${p[1] ? ' <span class="en">' + p[1] + '</span>' : ''}</div>`).join('')}
    </div>
  </section>`;
}

function renderArtist(r){
  const a = artist(r.id);
  if(!a) return `<section><p>${r.id} not found</p></section>`;
  const links = a.links.map(l => `<a href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗ <span class="muted">${SITE.newtab}</span></a>`).join('');
  const ws = worksOf(a.id);
  return `
  <section>
    <div class="head artist">
      <div class="block ph-face face">${SITE.face}<br>${a.id}</div>
      <div>
        <p class="name">${a.name}<small>${a.nameZh}｜${a.nat[0]} ${a.nat[1]}</small></p>
        ${biH('h3', SITE.bio)}${paras(a.bio[0])}${paras(a.bio[1], 'en')}
        ${biH('h3', SITE.links)}<div class="links">${links}</div>
      </div>
    </div>
  </section>
  ${a.video ? `<section><div class="block ph-video" style="aspect-ratio:16/9;border-radius:12px;font-size:18px;flex-direction:column">▶ ${worksOf(a.id).find(w => w.video).title[0]}<br><span style="font-size:14px;color:#CCC">${SITE.video[0]} ${SITE.video[1]}</span></div></section>` : ''}
  <section>
    <h2>${SITE.thisWorks[0]}（${ws.length}）<span class="en">${SITE.thisWorks[1]}</span></h2>
    <div class="grid works">${ws.map(workCard).join('')}</div>
  </section>`;
}

function renderWork(r){
  const w = workById(r.id);
  if(!w) return `<section><p>${r.id} not found</p></section>`;
  const chips = w.artists.map(id => `<a onclick="go('/artists/${id}')">${artist(id).name}</a>`).join('');
  const thumbs = Array.from({length:w.imgs}, (_, i) => `<div class="block ph-cover${i===0?' on':''}" data-i="${i+1}">${SITE.img} ${i+1}</div>`).join('');
  const mainCls = w.video ? 'block ph-video main' : 'block ph-cover main';
  const mainTxt = w.video ? `▶ ${w.title[0]}　${SITE.video[0]}` : `${SITE.img} 1 / ${w.imgs}`;
  const thanks = w.thanks ? `<dt>${bi(SITE.thanks)}</dt><dd>${w.thanks[0]}<br><span class="en">${w.thanks[1]}</span></dd>` : '';
  return `
  <section>
    <div class="head work" style="display:block">
      <div class="gallery">
        <div class="${mainCls}" id="mainImg" data-n="${w.imgs}">${mainTxt}</div>
        <div class="thumbs" id="thumbs">${thumbs}</div>
      </div>
      <div class="work-body">
        <div>
          <p class="name">${w.title[0]}<small>${w.title[1]}</small></p>
          ${biH('h3', SITE.byArtists)}<div class="chips">${chips}</div>
          ${biH('h3', SITE.desc)}${paras(w.desc[0])}${paras(w.desc[1], 'en')}
        </div>
        <dl>
          <dt>${bi(SITE.meta)}</dt><dd>${w.meta[0]}<br><span class="en">${w.meta[1]}</span></dd>
          ${thanks}
        </dl>
      </div>
    </div>
  </section>`;
}

let lastPath = null;
function render(){
  const r = parse();
  renderMenu(r);
  const app = document.getElementById('app');
  if(r.type === 'artists') app.innerHTML = renderArtist(r);
  else if(r.type === 'works') app.innerHTML = renderWork(r);
  else app.innerHTML = renderHome();
  const base = '臺北資料夾 File in Taipei';
  document.title = r.type === 'artists' ? ((artist(r.id)||{}).name || r.id) + ' | ' + base
                 : r.type === 'works' ? ((workById(r.id)||{title:[r.id]}).title[0]) + ' | ' + base
                 : base;
  const pageChanged = lastPath === null || lastPath !== r.path;
  lastPath = r.path;
  if(pendingScroll){ const s = pendingScroll; pendingScroll = null; setTimeout(() => scrollToSec(s), 50); }
  else if(pageChanged){ window.scrollTo({top:0}); }
  const th = document.getElementById('thumbs');
  if(th){
    th.addEventListener('click', e => {
      const b = e.target.closest('[data-i]'); if(!b) return;
      th.querySelectorAll('.block').forEach(x => x.classList.remove('on')); b.classList.add('on');
      const m = document.getElementById('mainImg');
      m.className = 'block ph-cover main'; m.textContent = `${SITE.img} ${b.dataset.i} / ${m.dataset.n}`;
    });
  }
}
window.addEventListener('hashchange', () => { state.path = hashPath() || '/home'; render(); });
state.path = hashPath() || '/home';
render();
</script>
