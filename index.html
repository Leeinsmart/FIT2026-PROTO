<style>
:root{--navy:#1F3A6B;--pink:#F3DCE3;--blue:#DCEAF5;--cream:#FAF8F2;--mag:#A83A6B;--ink:#222;--line:#D9D4C7;--face:#C98FA8;--cover:#7FA6CC;--video:#4A4A4A}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;line-height:1.7}
a{color:var(--navy)}
a:hover{color:var(--mag)}
.en{color:#666;font-size:.92em}

/* 固定 menu */
.menu{position:sticky;top:0;z-index:10;background:#fff;border-bottom:2px solid var(--navy)}
.menu .in{max-width:1100px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:24px}
.logo{font-weight:700;color:var(--navy);text-decoration:none;font-size:17px;margin-right:auto;cursor:pointer;white-space:nowrap}
.nav{display:flex;gap:24px;align-items:center}
.nav a{text-decoration:none;color:var(--navy);font-weight:600;cursor:pointer}
.burger{display:none;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:6px 12px;font-size:14px;cursor:pointer}
@media(max-width:768px){
  .nav{display:none}
  .nav.open{display:flex;flex-direction:column;align-items:flex-start;position:absolute;left:0;right:0;top:56px;background:#fff;border-bottom:2px solid var(--navy);padding:12px 16px 16px;gap:14px}
  .burger{display:block}
}

.wrap{max-width:1100px;margin:0 auto;padding:16px}
section{padding:28px 0;scroll-margin-top:64px}
h2{margin:0 0 16px;color:var(--navy);font-size:22px}
h2 .en,h3 .en{font-weight:400;margin-left:8px}
h3{margin:18px 0 6px;color:var(--navy);font-size:18px}
p{margin:0 0 10px}
.muted{color:#666;font-size:14px}

/* 首頁 ① */
.hero{background:var(--navy);color:#fff;padding:48px 28px;border-radius:12px}
.hero .t1{font-size:34px;font-weight:700;line-height:1.2;margin:0}
.hero .t2{font-size:20px;color:#A9C8E8;margin:4px 0 16px}
.hero p{color:#E6EEF8;max-width:720px}
.hero .en{color:#B8CCE6}

/* 首頁 ②③ */
.sec-artists{background:var(--pink);border-radius:12px;padding:24px}
.sec-works{background:var(--blue);border-radius:12px;padding:24px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.grid.works{grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}
@media(min-width:769px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}.grid.works{grid-template-columns:repeat(5,1fr)}}
/* 索引卡：上緣一個資料夾分頁標籤，卡身白底細框 */
.card{cursor:pointer;color:var(--navy)}
.card .tab{display:inline-block;background:var(--navy);color:#fff;font-size:11px;letter-spacing:.5px;padding:2px 12px 1px;border-radius:6px 6px 0 0;font-family:Menlo,monospace}
.card .body{background:#fff;border:1.5px solid var(--navy);border-radius:0 8px 8px 8px;overflow:hidden;box-shadow:2px 2px 0 rgba(31,58,107,.12)}
.card:hover .tab{background:var(--mag)}
.card:hover .body{border-color:var(--mag);box-shadow:2px 2px 0 rgba(168,58,107,.2)}
.card .cap{padding:8px 10px;font-size:14px;line-height:1.45;border-top:1px dashed #C9CFDA}
.card .cap b{display:block}
.block{display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;text-align:center;padding:8px}
.ph-face{background:var(--face);aspect-ratio:1/1}
.ph-cover{background:var(--cover);aspect-ratio:4/3}
.ph-video{background:var(--video)}

/* 頁尾 ④ */
.footer{background:var(--navy);color:#D6E4F5;border-radius:12px;padding:24px 28px;font-size:14px}
.footer div{margin:2px 0}
.footer .en{color:#A9C8E8}

/* 專頁 */
.head{display:grid;grid-template-columns:200px 1fr;gap:24px;border-radius:12px;padding:24px}
.head.artist{background:var(--pink)}
.head.work{background:var(--blue)}
@media(max-width:600px){.head{grid-template-columns:1fr}}
.face{width:200px;height:200px;border-radius:50%}
img.face{display:block;object-fit:cover}
.ph-img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.name{font-size:26px;font-weight:700;color:var(--navy);margin:0;line-height:1.3}
.name small{display:block;font-size:16px;font-weight:400;color:#555;margin-top:4px}
.links a{display:inline-block;margin:6px 12px 0 0;padding:6px 12px;border:1px solid var(--navy);border-radius:20px;text-decoration:none;font-size:14px}
.links a:hover{border-color:var(--mag)}
.chips a{display:inline-block;margin:0 10px 6px 0;font-weight:700;cursor:pointer;color:var(--mag);text-decoration:underline}

/* 作品圖瀏覽 */
.gallery .main{aspect-ratio:3/2;border-radius:10px;font-size:18px}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:4px}
.thumbs .block{flex:0 0 96px;height:68px;border-radius:6px;cursor:pointer;border:3px solid transparent;font-size:12px}
.thumbs .block.on{border-color:var(--mag)}
.work-body{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;margin-top:20px}
@media(max-width:768px){.work-body{grid-template-columns:1fr}}
dl{margin:0}
dt{font-weight:700;color:var(--navy);margin-top:12px}
dd{margin:0}
</style>

  "desc": [
   [
    "中山區赤峰街深具金屬加工與打鐵產業之歷史脈絡，其商業活動長期與金屬材料緊密結合。隨時代推移轉型為汽車零件與維修產業之集散地，現今此區呈現傳統產業與現代藝文空間並置的獨特地景，於工業底蘊中交織出當代文化的時空對話。",
    "當地商家專精於二手零件之維修與重組，使物質在修復中重獲流通價值。此種對進口零件進行精細再生之實踐，構成作品之核心哲學：物質之循環與修復美學。在赤峰街，「修復」並非單純的功能恢復，而是一種連結過去與未來的藝術隱喻。"
   ],
   [
    "Chifeng Street in the Zhongshan District possesses a profound historical context rooted in metalworking and blacksmithing industries, where commercial activities have long been inextricably linked with metallic materials. Originally serving as the core of the \"Blacksmith Street,\" the area evolved into a hub for automobile parts and repair services over time. Today, this district presents a unique landscape where traditional industries and contemporary art spaces coexist, weaving a dialogue between past and present within an industrial foundation.",
    "Local merchants specialize in the repair and reassembly of second-hand parts, allowing materials to regain circulation value through restoration. This practice of meticulous regeneration of imported components forms the core philosophy of the work: the aesthetics of material circulation and repair. In Chifeng Street, \"repair\" is not merely functional recovery, but an artistic metaphor connecting the past and the future."
   ]

  "thanks": "藝高文創股份有限公司、杉木藝術有限公司、吳美瑩里長、<br>捌千代居酒屋、三條通熱情的鄰居們",
  "desc": [
   [
    "一直以來，怪獸都是貫穿拾壹shiroooo11 作品的重要代表性符號。這次的設計中，藝術家將一隻魚化身為花壽司怪獸，穿梭於條通商圈之間。",
    "條通商圈所在區域，是臺北日治時期日本人聚居與商業、飲食娛樂活動的重要街區之一。至今仍保留濃厚的日本街區氛圍，也在長期的歷史交流中，發展出臺日文化交織的城市樣貌。",
    "因此，在這件作品中，拾壹shiroooo11選擇以臺灣近代建築常見的花磚紋樣，結合日本飲食文化中具有代表性的拉麵與花壽司，作為畫面的主要視覺元素。壽司魚遊走於臺式與日式生活意象之間，象徵兩種文化在日常生活中的交會、互相影響，並逐漸發展出屬於臺灣的文化風景。",
    "作品中的魚與麵條也承載著祝福寓意。魚象徵「年年有餘、豐衣足食」；麵條在華人與日本文化中，都有平安順遂、情誼長久的寓意。藝術家希望透過這兩個元素，表達對文化交流的祝福，也祝願這份跨文化的情誼能夠長久延續。"
   ],
   [
    "Monsters have always been a recurring symbol in shiroooo11's work. For this mural, the artist transformed a fish into a flower sushi monster, swimming through the Tiaotong district.",
    "During the Japanese colonial period, the Tiaotong district was an important area in Taipei where Japanese residents lived and engaged in commercial, dining, and entertainment activities. Today, the neighborhood retains a strong Japanese atmosphere, while its long history of cultural exchange has shaped a unique urban landscape where Taiwanese and Japanese cultures intertwine.",
    "For this work, shiroooo11 combined colorful floral tiles, commonly found in Taiwan's modern architecture, with ramen and flower sushi, iconic elements of Japanese food culture. The sushi fish travels between Taiwanese and Japanese cultural imagery, symbolizing how the two cultures meet and influence one another in everyday life, gradually shaping a cultural landscape unique to Taiwan.",
    "The fish and noodles in the work also carry wishes of good fortune. The fish symbolizes abundance and prosperity, echoing the Chinese saying \"may you have surplus year after year.\" In both Chinese and Japanese cultures, noodles represent peace, good fortune, and lasting friendship. Through these two elements, the artist hopes to express blessings for cultural exchange and wishes for this cross-cultural friendship to endure for years to come."
   ]

    "士林是一個不同世代、傳統與生活方式共存的行政區，形塑出不斷變化的城市風景。市場、學校、公園與住宅區構成一張錯綜複雜的日常經驗網絡，新與舊在此不斷交會。這些相互交疊的現實，成為本作品的創作起點。",

    "《Shared Grounds》認為歸屬感並非固定不變，而是透過相遇、共享空間與日常互動持續建構而成。作品邀請觀眾思考那些將社區凝聚在一起的無形連結。"

   [
    "Shared Grounds explores the layers that shape a neighbourhood and the relationships between the people who inhabit it. Drawing inspiration from Shilin, Taipei, the composition brings together locally sourced fabrics, textures and patterns as fragments of a shared environment.",
    "Shilin is a district where different generations, traditions and ways of life coexist, creating a constantly evolving urban landscape. Markets, schools, parks and residential areas form part of a complex network of everyday experiences, where the old and the new continuously intersect. These overlapping realities become the starting point for the work.",

   [
    "本計畫始於一朵以紙與紙漿製作而成的巨型花朵。這朵花並未停留在展覽空間中，而是被帶進城市，成為一件具表演性的物件，也成為開啟社會互動的契機。",
    "藝術家帶著花朵走過不同街區與日常場域，邀請陌生人與花合影，促成隨機的相遇與意想不到的拍攝情境。參與者可以自由選擇姿勢、提議地點，或自創情境，讓每一次互動都以各自的方式形塑這項計畫。一面中英雙語的告示牌向路人介紹計畫內容，邀請他們一同參與。",
    "起初，藝術家對於人們會有什麼反應感到忐忑，卻逐漸發現一種出乎意料的開放與慷慨。好奇、笑聲、讚美與自發的參與，讓這段經驗成為一種認識臺北的方式，跳脫一般觀光客的視角。過程本身也成為冒險的一部分：花朵不尋常的尺寸，在城市各處帶來了臨場應變的解決辦法、熱心相助的相遇，以及意料之外的繞道。",
    "最終的攝影作品輸出於鋁板上，構成一本視覺日記，記錄花朵的旅程，以及那些短暫成為其中一部分的人們。這件作品不只是一系列肖像，更記錄了轉瞬即逝的連結，以及一件不尋常的物件如何暫時改變陌生人之間、人與周遭環境之間的關係。",
    "本計畫也是一個持續發展系列的起點。未來，藝術家將在每個地方創作一朵新的花，從當地的材料、視覺文化與社會脈絡中汲取靈感。每一朵花都將成為新相遇的起點，讓作品透過所接觸的人與地方持續演變。"
   ],
   [
    "This project began with the making of an oversized flower from paper and papier-mâché. Rather than remaining confined to the exhibition space, the flower was carried through the city, becoming a performative object and a pretext for social interaction.",
    "Walking through different neighbourhoods and everyday spaces, the artist invited strangers to pose alongside the flower, encouraging spontaneous encounters and unexpected photographic situations. Participants were free to choose their poses, suggest locations or invent their own scenarios, allowing each interaction to shape the project in its own way. A bilingual sign in English and Chinese introduced the project to passers-by, inviting them to take part.",
    "Initially apprehensive about how people would react, the artist gradually discovered an unexpected openness and generosity. Curiosity, laughter, compliments and spontaneous participation transformed the experience into a way of discovering Taipei beyond the usual perspective of a tourist. The process itself became part of the adventure, as the flower's unusual size led to improvised solutions, helpful encounters and unexpected detours throughout the city.",
    "The resulting photographs, printed on aluminium, form a visual diary of the flower's journey and the people who briefly became part of it. More than a collection of portraits, the work documents fleeting connections and the ways an unusual object can temporarily transform relationships between strangers and their surroundings.",
    "This project marks the beginning of an ongoing series in which a new flower will be created for each place, drawing inspiration from its local materials, visual culture and social context. Each flower will become a starting point for new encounters, allowing the work to evolve through the people and places it engages with."
   ]

   [
    "這幅壁畫的靈感來自 Thea Macera 在夏季與臺北的相遇。這是一個天氣變幻莫測、豪雨與颱風頻繁、濕氣難耐的季節。來自法國的她，一開始難以適應這種與家鄉截然不同的熱帶氣候。",
    "然而，在這些氣候挑戰之外，城市中無所不在的自然景觀也令她深受震撼。繁茂的植物、盛開的花朵與茂密的森林，和都市環境共存，形成城市與自然彼此交織的風景。",
    "壁畫描繪了兩朵飽含雨水的雲，但雲朵灑落的不是雨水，而是花朵。這個簡單的轉化，映照出她對臺北的認識過程：起初令人難以招架、感到陌生的一切，逐漸成為令人著迷的來源。花朵代表當地豐富的植物生態，雲朵則喚起那些形塑她初次城市經驗的多變天氣。",
    "鮮明的色彩也是對臺北繽紛街道、創意精神與視覺活力的致敬。Thea Macera 沒有選擇細緻描繪城市，而是以一個簡單、富有趣味的畫面，結合這段經驗中兩個對比鮮明的面向：熱帶氣候的強烈，以及周遭植物的美好。",
    "這幅壁畫是她對這段臺灣經驗的個人詮釋，呈現出適應陌生環境的過程，以及在起初看似艱難的事物中發現美的歷程。"
   ],
   [
    "This mural was inspired by Thea Macera's encounter with Taipei during the summer, a season marked by unpredictable weather, torrential rain, typhoons and overwhelming humidity. Coming from France, she found it challenging to adapt to this tropical climate, which was so different from what she was used to.",
    "Yet, alongside these climatic challenges, she was struck by the extraordinary presence of nature throughout the city. Lush vegetation, abundant flowers and dense forests coexist with the urban environment, creating a landscape where the city and nature seem to intertwine.",
    "The mural depicts two rain-filled clouds, but instead of releasing water, they shower the ground with flowers. This simple transformation reflects her discovery of Taipei: what initially felt overwhelming and unfamiliar gradually became a source of fascination. The flowers represent the richness of the local flora, while the clouds evoke the unpredictable weather that shaped her first experience of the city.",
    "The vibrant colour palette is also a tribute to Taipei's colourful streets, creative spirit and visual energy. Rather than offering a detailed representation of the city, Macera chose a simple and playful image that brings together two contrasting aspects of her experience: the intensity of the tropical climate and the beauty of the surrounding vegetation.",
    "This mural is a personal interpretation of her encounter with Taiwan. It reflects the process of adapting to an unfamiliar environment and discovering beauty in what first seems difficult."
   ]
  ],

  "desc": [
   [
    "這件壁畫喚起了 madkidgenius 濃厚的個人懷舊情感：在臺灣南部度過的童年遊戲時光、彷彿永無止境的下課時間，以及 1990 年代末期在公園裡消磨的漫長午後。那時，巨大的水泥大象溜滑梯隨處可見。在不同文化之間生活、走遍世界多年後，他回到臺灣，才發現這些具代表性的遊具已逐漸從城市風景中消失，悄悄地走向滅絕。",
    "與這座粗獷主義風格遊樂場的相遇，讓所有童年記憶瞬間湧現。遊樂場坐落於臺北歷史悠久的條通商圈，這個街區從日治時期仿照棋盤格局規劃的街道，逐漸發展成充滿活力的夜生活重鎮。對藝術家而言，一頭棋盤格紋的大象，正是串連過去與現在的最佳橋梁。在亞洲各地的傳統中，大象象徵力量與穩定，也讓這件作品成為向陪伴一代代孩子成長的經典遊具致敬的最佳方式。",
    "在視覺呈現上，madkidgenius 選擇不遮蓋遊樂場原始的水泥表面。他一直深受 1950 年代粗獷主義（Brutalism）與清水混凝土（béton brut）那種未經修飾、厚重質感的吸引。他以多種戶外壓克力顏料，將鮮明而充滿能量的色彩直接塗繪在歷經風霜的水泥上，讓藝術與場域本身的自然紋理共存。",
    "最終，這件作品是藝術家回到創作初衷的一段個人旅程：對純藝術、流行文化與趣味敘事的熱愛。他將逐漸消逝的在地記憶，疊上一層大膽而嶄新的色彩，為公園創造一個有趣的打卡點，讓年長的世代在此緬懷過往，也讓新一代的孩子盡情玩耍。"
   ],
   [
    "This mural taps into a strong wave of personal nostalgia for madkidgenius: childhood playtimes in southern Taiwan, endless school recesses, and long late-’90s afternoons in the park. Back then, massive concrete elephant slides were everywhere. After years of living across different cultures and traveling the world, he returned home to Taiwan and realized how these iconic structures had slowly faded from the landscape, quietly drifting toward extinction.",
    "Encountering this brutalist playground brought all those core memories rushing back. The playground sits in Taipei’s historic Tiaotong district, a neighborhood that evolved from a Japanese-era grid inspired by a chessboard pattern into a dynamic nightlife hub. For the artist, a checkered elephant felt like the perfect bridge. Across Asian traditions, the elephant stands for strength and stability, making it a fitting tribute to the classic play structures that anchored generations of kids.",
    "Visually, madkidgenius chose not to mask or cover up the playground’s raw concrete surface. He has always been drawn to the unrefined, heavy weight of 1950s Brutalism and béton brut. Using a mix of exterior acrylics, he applied vibrant, high-energy colors directly onto the weathered concrete, allowing the art and the site’s natural texture to coexist.",
    "Ultimately, this piece is the artist’s personal loop back to what started it all: a love for fine art, pop culture, and playful storytelling. It takes a fading piece of local memory and adds a bold, fresh layer to the park, creating a fun checkpoint where older generations can reminisce and new kids can simply enjoy playing."

/* 介面固定用字 */
const SITE = {
  face:'大頭貼', cover:'作品封面', videoShort:'影片',
  bio:['基本介紹','About'], links:['外部連結','Links'], newtab:'新分頁 new tab',
  thisWorks:['本次作品','Works in this program'],
  video:['影片，點了直接播放','Video, plays on click'],
  img:'作品圖', byArtists:['創作藝術家','Artists'], desc:['詳細介紹','About the work'],
  thanks:['協力與致謝','Collaborators & Thanks'],
};
/* 中英並列；兩邊一樣只放一次，缺一邊就只放有的那邊 */
const bil = p => !p ? '' : (p[0] && p[1] && p[1] !== p[0]) ? `${p[0]} <span class="en">${p[1]}</span>` : (p[0] || p[1] || '');
const biH = (tag, p) => `<${tag}>${p[0]}<span class="en">${p[1]}</span></${tag}>`;
const paras = (arr, cls) => arr.map(s => `<p${cls ? ' class="' + cls + '"' : ''}>${s}</p>`).join('');

/* ===== 路由：#/home、#/artists/A01、#/works/W01 ===== */
const state = {path: ''};
function hashPath(){ return location.hash.replace(/^#/, ''); }
function parse(){
  let h = state.path;
  if(!h) h = '/home';
  const p = h.split('/').filter(Boolean);
  const type = p[0] || 'home';
  const id = p[1] || '';
  return {type, id, path:'/' + [type, id].filter(Boolean).join('/')};
}
function go(path){
  state.path = path;
  try{ location.hash = path; }catch(e){}
  if(hashPath() !== path) render();   /* 網址列不能帶 # 的環境（例如 data: 開啟）就直接換畫面 */
}
let pendingScroll = null;
function menuTo(sec){
  const r = parse();
  closeNav();
  if(r.type === 'home'){ scrollToSec(sec); }
  else { pendingScroll = sec; go('/home'); }
}
function scrollToSec(sec){
  const el = document.getElementById(sec);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}
function closeNav(){ document.getElementById('nav').classList.remove('open'); setBurger(); }
function setBurger(){ document.getElementById('burger').textContent = document.getElementById('nav').classList.contains('open') ? '關閉 Close' : '選單 Menu'; }

/* ===== 畫面 ===== */
function worksOf(aid){ return WORKS.filter(w => w.artists.includes(aid)); }
function artist(id){ return ARTISTS.find(a => a.id === id); }
function workById(id){ return WORKS.find(w => w.id === id); }

function renderMenu(r){
  document.getElementById('logo').textContent = PROGRAM.title.filter(Boolean).join(' ');
  document.getElementById('navArtists').textContent = PROGRAM.menu[0].filter(Boolean).join(' ');
  document.getElementById('navWorks').textContent = PROGRAM.menu[1].filter(Boolean).join(' ');
  document.getElementById('logo').onclick = () => { closeNav(); if(r.type === 'home'){ window.scrollTo({top:0, behavior:'smooth'}); } else { go('/home'); } };
  document.getElementById('navArtists').onclick = () => menuTo('artists');
  document.getElementById('navWorks').onclick = () => menuTo('works');
  document.getElementById('burger').onclick = () => { document.getElementById('nav').classList.toggle('open'); setBurger(); };
}

function artistCard(a){
  return `<div class="card" onclick="go('/artists/${a.id}')">
    <div class="tab">${a.id}</div>
    <div class="body">
      ${a.photo ? `<img class="ph-img" src="${a.photo}" alt="${a.name}">` : `<div class="block ph-face">${SITE.face}<br>${a.id}</div>`}
      <div class="cap"><b>${a.name}</b>${a.nat ? `<span class="muted">${a.nat.filter(Boolean).join(' ')}</span>` : ''}</div>
    </div></div>`;
}
const titleMain = w => w.title[0] || w.title[1];
const titleSub = w => w.title[0] && w.title[1] ? w.title[1] : '';
const videoOf = aid => worksOf(aid).find(w => w.video);
function workCard(w){
  const cls = w.video ? 'ph-cover ph-video' : 'ph-cover';
  return `<div class="card" onclick="go('/works/${w.id}')">
    <div class="tab">${w.id}</div>
    <div class="body">
      <div class="block ${cls}">${w.video ? SITE.videoShort : SITE.cover}<br>${w.id}</div>
      <div class="cap"><b>${titleMain(w)}</b>${titleSub(w) ? `<span class="en">${titleSub(w)}</span>` : ''}</div>
    </div></div>`;
}

function renderHome(){
  return `
  <section id="top">
    <div class="hero">
      <p class="t1">${PROGRAM.title[0]}</p>
      <p class="t2">${PROGRAM.title[1]}</p>
      <p>${PROGRAM.fullName[0]}<br><span class="en">${PROGRAM.fullName[1]}</span></p>
      <p>${bil(PROGRAM.dates)}</p>
      ${PROGRAM.intro ? paras(PROGRAM.intro[0]) + paras(PROGRAM.intro[1], 'en') : ''}
    </div>
  </section>
  <section id="artists">
    <div class="sec-artists">
      ${biH('h2', PROGRAM.secArtists)}
      <div class="grid">${ARTISTS.map(artistCard).join('')}</div>
    </div>
  </section>
  <section id="works">
    <div class="sec-works">
      ${biH('h2', PROGRAM.secWorks)}
      <div class="grid works">${WORKS.map(workCard).join('')}</div>
    </div>
  </section>
  <section id="footer">
    <div class="footer">
      ${PROGRAM.footer.map(p => `<div>${p[0]}${p[1] ? ' <span class="en">' + p[1] + '</span>' : ''}</div>`).join('')}
    </div>
  </section>`;
}

function renderArtist(r){
  const a = artist(r.id);
  if(!a) return `<section><p>${r.id} not found</p></section>`;
  const links = a.links.map(l => `<a href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗ <span class="muted">${SITE.newtab}</span></a>`).join('');
  const ws = worksOf(a.id);
  const sub = [a.born ? `${a.born} 年生 b. ${a.born}` : '', a.nat ? a.nat.filter(Boolean).join(' ') : ''].filter(Boolean).join('｜');
  const hasBio = a.bio[0].length || a.bio[1].length;
  const vw = videoOf(a.id);
  return `
  <section>
    <div class="head artist">
      ${a.photo ? `<img class="face" src="${a.photo}" alt="${a.name}">` : `<div class="block ph-face face">${SITE.face}<br>${a.id}</div>`}
      <div>
        <p class="name">${a.name}${sub ? `<small>${sub}</small>` : ''}</p>
        ${hasBio ? biH('h3', SITE.bio) + paras(a.bio[0]) + paras(a.bio[1], 'en') : ''}
        ${a.links.length ? biH('h3', SITE.links) + `<div class="links">${links}</div>` : ''}
      </div>
    </div>
  </section>
  ${vw ? `<section><div class="block ph-video" style="aspect-ratio:16/9;border-radius:12px;font-size:18px;flex-direction:column">▶ ${titleMain(vw)}<br><span style="font-size:14px;color:#CCC">${SITE.video[0]} ${SITE.video[1]}</span></div></section>` : ''}
  <section>
    <h2>${SITE.thisWorks[0]}（${ws.length}）<span class="en">${SITE.thisWorks[1]}</span></h2>
    <div class="grid works">${ws.map(workCard).join('')}</div>
  </section>`;
}

function renderWork(r){
  const w = workById(r.id);
  if(!w) return `<section><p>${r.id} not found</p></section>`;
  const chips = w.artists.map(id => `<a onclick="go('/artists/${id}')">${artist(id).name}</a>`).join('');
  const thumbs = Array.from({length:w.imgs}, (_, i) => `<div class="block ph-cover${i===0?' on':''}" data-i="${i+1}">${SITE.img} ${i+1}</div>`).join('');
  const mainCls = w.video ? 'block ph-video main' : 'block ph-cover main';
  const mainTxt = w.video ? `▶ ${titleMain(w)}　${SITE.video[0]}` : `${SITE.img} 1 / ${w.imgs}`;
  const meta = w.meta.map(m => `<dt>${bil([m[0], m[1]])}</dt><dd>${bil([m[2], m[3]])}</dd>`).join('');
  const thanks = w.thanks ? `<dt>${bil(SITE.thanks)}</dt><dd>${w.thanks}</dd>` : '';
  const hasDesc = w.desc[0].length || w.desc[1].length;
  return `
  <section>
    <div class="head work" style="display:block">
      <div class="gallery">
        <div class="${mainCls}" id="mainImg" data-n="${w.imgs}">${mainTxt}</div>
        ${w.imgs ? `<div class="thumbs" id="thumbs">${thumbs}</div>` : ''}
      </div>
      <div class="work-body">
        <div>
          <p class="name">${titleMain(w)}${titleSub(w) ? `<small>${titleSub(w)}</small>` : ''}</p>
          ${biH('h3', SITE.byArtists)}<div class="chips">${chips}</div>
          ${hasDesc ? biH('h3', SITE.desc) + paras(w.desc[0]) + paras(w.desc[1], 'en') : ''}
        </div>
        <dl>
          ${meta}
          ${thanks}
        </dl>
      </div>
    </div>
  </section>`;
}

let lastPath = null;
function render(){
  const r = parse();
  renderMenu(r);
  const app = document.getElementById('app');
  if(r.type === 'artists') app.innerHTML = renderArtist(r);
  else if(r.type === 'works') app.innerHTML = renderWork(r);
  else app.innerHTML = renderHome();
  const base = '臺北資料夾 File in Taipei';
  document.title = r.type === 'artists' ? ((artist(r.id)||{}).name || r.id) + ' | ' + base
                 : r.type === 'works' ? (workById(r.id) ? titleMain(workById(r.id)) : r.id) + ' | ' + base
                 : base;
  const pageChanged = lastPath === null || lastPath !== r.path;
  lastPath = r.path;
  if(pendingScroll){ const s = pendingScroll; pendingScroll = null; setTimeout(() => scrollToSec(s), 50); }
  else if(pageChanged){ window.scrollTo({top:0}); }
  const th = document.getElementById('thumbs');
  if(th){
    th.addEventListener('click', e => {
      const b = e.target.closest('[data-i]'); if(!b) return;
      th.querySelectorAll('.block').forEach(x => x.classList.remove('on')); b.classList.add('on');
      const m = document.getElementById('mainImg');
      m.className = 'block ph-cover main'; m.textContent = `${SITE.img} ${b.dataset.i} / ${m.dataset.n}`;
    });
  }
}
window.addEventListener('hashchange', () => { state.path = hashPath() || '/home'; render(); });
state.path = hashPath() || '/home';
render();
</script>
